<script>

  // I understand the logic.
  const darkModeToggle = document.getElementById('dark-mode-toggle');
  const htmlElement = document.documentElement;

  const darkModePreference = localStorage.getItem('darkMode');
  if (darkModePreference === 'enabled') {
    htmlElement.classList.add('dark-mode');
  }

  // I understand the logic. When clicked, toggle dark mode is enabled and disabled.
  darkModeToggle.addEventListener('click', function () {
    htmlElement.classList.toggle('dark-mode');

    if (htmlElement.classList.contains('dark-mode')) {
      localStorage.setItem('darkMode', 'enabled');
    } else {
      localStorage.setItem('darkMode', 'disabled');
    }
  });


  // I don't understand what this does. I know it has to do with the hamburger menu but I don't understand how it works.
  const hamburger = document.getElementById('hamburger');
  const navMenu = document.getElementById('nav-menu');
  const navLinks = navMenu.querySelectorAll('a');

  // Im not sure I understand the logic. I know it toggles the menu.
  hamburger.addEventListener('click', function () {
    hamburger.classList.toggle('active');
    navMenu.classList.toggle('active');

    const isExpanded = hamburger.getAttribute('aria-expanded') === 'true';
    hamburger.setAttribute('aria-expanded', !isExpanded);
  });

  // I understand the logic after looking up what it does. If you click a link, close the menu.
  navLinks.forEach(link => {
    link.addEventListener('click', function () {
      hamburger.classList.remove('active');
      navMenu.classList.remove('active');
      hamburger.setAttribute('aria-expanded', 'false');
    });
  });

  document.addEventListener('click', function (event) {
    const isClickInsideNav = event.target.closest('nav');
    if (!isClickInsideNav && hamburger.classList.contains('active')) {
      hamburger.classList.remove('active');
      navMenu.classList.remove('active');
      hamburger.setAttribute('aria-expanded', 'false');
    }
  });
</script>
